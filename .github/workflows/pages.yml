name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the content checks gate the deploy; a failing build must not publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it, so a half-uploaded artifact is
# never what gets deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /true-muslim
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client/true-muslim

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
